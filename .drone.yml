---
kind: pipeline
type: docker
name: multiarch-manifest

steps:
  - name: manifest-latest
    image: plugins/manifest
    settings:
      spec: 15/manifest-spec.yml
      username: andreipoe
      password:
        from_secret: docker_token
  - name: manifest-15.6
    image: plugins/manifest
    settings:
      spec: 15.6/manifest-spec.yml
      username: andreipoe
      password:
        from_secret: docker_token
    when:
      status: [success, failure]
  - name: manifest-15.7
    image: plugins/manifest
    settings:
      spec: 15.7/manifest-spec.yml
      username: andreipoe
      password:
        from_secret: docker_token
    when:
      status: [success, failure]
  - name: manifest-16.0
    image: plugins/manifest
    settings:
      spec: 16.0/manifest-spec.yml
      username: andreipoe
      password:
        from_secret: docker_token
    when:
      status: [success, failure]
  - name: healthcheck
    image: ubuntu
    environment:
      HEALTHCHECKS_URL:
        from_secret: healthchecks_url
    commands:
      - apt-get update
      - apt-get -y install curl
      - |
        if [ ${DRONE_BUILD_STATUS} = success ]; then
          curl --retry 3 $${HEALTHCHECKS_URL}
        else
          curl --retry 3 $${HEALTHCHECKS_URL}/fail
        fi
    when:
      status: [success, failure]

depends_on: [build-aarch64, build-amd64]
trigger:
  status: [success, failure]

