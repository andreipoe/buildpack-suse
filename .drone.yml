---
kind: pipeline
type: docker
name: build-aarch64

platform:
  arch: arm64
  os: linux

steps:
  - name: build-latest
    image: plugins/docker
    settings:
      repo: andreipoe/buildpack-suse
      tags:
        - 15-aarch64
        - latest-aarch64
      dockerfile: 15/Dockerfile
      username: andreipoe
      password:
        from_secret: docker_token
    depends_on: [clone]
  - name: build-15.6
    image: plugins/docker
    settings:
      repo: andreipoe/buildpack-suse
      tags:
        - 15.6-aarch64
      dockerfile: 15.6/Dockerfile
      username: andreipoe
      password:
        from_secret: docker_token
    depends_on: [clone]
    when:
      status: [success, failure]
  - name: build-15.7
    image: plugins/docker
    settings:
      repo: andreipoe/buildpack-suse
      tags:
        - 15.7-aarch64
      dockerfile: 15.7/Dockerfile
      username: andreipoe
      password:
        from_secret: docker_token
    depends_on: [clone]
    when:
      status: [success, failure]
  - name: build-16.0
    image: plugins/docker
    settings:
      repo: andreipoe/buildpack-suse
      tags:
        - 16.0-aarch64
      dockerfile: 16.0/Dockerfile
      username: andreipoe
      password:
        from_secret: docker_token
    depends_on: [clone]
    when:
      status: [success, failure]

